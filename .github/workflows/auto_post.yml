name: Validate approval-gated Threads client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "threads_api.py"
      - "draft_workflow.py"
      - "AUTOMATION_PROMPT.md"
      - "STYLE_GUIDE.md"
      - "tests/**"
      - ".github/workflows/auto_post.yml"
  pull_request:
    paths:
      - "threads_api.py"
      - "draft_workflow.py"
      - "AUTOMATION_PROMPT.md"
      - "STYLE_GUIDE.md"
      - "tests/**"
      - ".github/workflows/auto_post.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile threads_api.py draft_workflow.py
      - name: Test
        run: python -m unittest discover -s tests -v
